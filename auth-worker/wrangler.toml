# Cloudflare Worker for VATSIM Connect sign-in and the per-page CID access lists.
# Setup: see auth-worker/README.md.
name = "vam-auth"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

[vars]
# Origins the site is served from (comma-separated). Add http://localhost:5173 to sign in
# from `npm run dev`.
ALLOWED_ORIGINS = "https://nphunt.github.io"
VATSIM_AUTH_BASE = "https://auth.vatsim.net"
# Full access to every page, can't be removed on the admin page.
SUPERADMIN_CIDS = "1935951"

# Create with: npx wrangler kv namespace create ACCESS   (then paste the id here)
[[kv_namespaces]]
binding = "ACCESS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never in this file): npx wrangler secret put <NAME>
#   SESSION_SECRET        random, 32+ characters (e.g. `openssl rand -base64 48`)
#   VATSIM_CLIENT_ID      from your VATSIM Connect application
#   VATSIM_CLIENT_SECRET  from your VATSIM Connect application
