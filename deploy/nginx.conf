# nginx in front of the Airspace Monitor server (server/README.md).
#
# 1. Point your domain's DNS A/AAAA record at the VPS.
# 2. The site address below is airspace-monitor.memphisartcc.com. If you move, replace it
#    with the new domain. Use the same origin as PUBLIC_URL in .env and as the redirect URL
#    registered with VATSIM Connect (https://<domain>/auth/callback).
# 3. Open ports 80 and 443 on the firewall, and keep 3000 closed: the server listens on
#    127.0.0.1 only (HOST in .env). Run it with deploy/airspace-monitor.service.
# 4. Install as /etc/nginx/sites-available/airspace-monitor, link it into sites-enabled,
#    then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Everything goes to the Node server, which does the sign-in and serves the site. Don't
# serve files from disk here (root/try_files): that skips the sign-in entirely.
#
# Access logs hold IP addresses and paths; the privacy policy says they are kept 30 days.
# nginx doesn't delete them itself: set `rotate 30` with `daily` for this log in
# /etc/logrotate.d/nginx. Change both together.

server {
    listen 80;
    listen [::]:80;
    server_name airspace-monitor.memphisartcc.com;

    # Plain HTTP can't sign in (the cookies are Secure), so send everyone to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name airspace-monitor.memphisartcc.com;

    ssl_certificate     /etc/nginx/ssl/memphisartcc.com.crt;
    ssl_certificate_key /etc/nginx/ssl/memphisartcc.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;

    # The server already sends the CSP, Strict-Transport-Security, X-Frame-Options and
    # X-Content-Type-Options headers, so they aren't repeated here (two different
    # X-Frame-Options values cancel each other out).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    # Without gzip_proxied nginx won't compress anything that came from the server.
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # The server sends a sign-in that arrives on any other host name over to PUBLIC_URL,
        # so without the real Host it redirects forever.
        proxy_set_header Host $host;
        # The sign-in rate limit is per address; without this everyone shares one.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sign-in is a redirect to VATSIM and back, so a slow reply means a hung server.
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/airspace-monitor.access.log;
    error_log  /var/log/nginx/airspace-monitor.error.log;
}
