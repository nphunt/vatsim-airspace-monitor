# Builds and fully checks one branch for GitHub Pages, and uploads it as an artifact.
# Called by deploy.yml twice: main for the site root, development for /dev/.
name: build-site

on:
  workflow_call:
    inputs:
      ref:
        description: Branch to build
        required: true
        type: string
      subpath:
        description: Folder of the site to build for ("" = the root, "dev" = /dev/)
        required: false
        type: string
        default: ""
      artifact:
        description: Name of the uploaded build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Stamped into the build (dev notice, ABOUT); GITHUB_REF_NAME is the branch that
      # triggered the run, not necessarily this one.
      BUILD_BRANCH: ${{ inputs.ref }}
      PAGES_SUBPATH: ${{ inputs.subpath }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Never publish an untested build.
      - run: npm run lint
      - run: npm test
      - run: npm run validate-data
      # GITHUB_ACTIONS=true (always set here) builds with the /<repo>/[subpath/] base path.
      - run: npm run build
      # The build must be stamped with the branch it was built from; a build config that
      # doesn't honor BUILD_BRANCH (or writes no build.json) could put the development
      # notice on the live site, so nothing publishes.
      - name: Check the build's branch stamp
        run: |
          stamped=$(node -p "require('./dist/build.json').branch")
          if [ "$stamped" != "$BUILD_BRANCH" ]; then
            echo "::error::build stamped '$stamped', expected '$BUILD_BRANCH'"; exit 1
          fi
          echo "stamped $stamped @ $(node -p "require('./dist/build.json').id")"
      - run: npm run check-dist
      - run: npx playwright-core install --with-deps chromium
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: dist
          retention-days: 1
